# ===== Notification Templates =====
notification.verificationEmail.subject=Finsight - Welcome
notification.verificationEmail.body=<h1>Welcome {username}</h1><p>Your temporary password: <b>{temporaryPassword}</b></p><p>Click <a href="{verificationUrl}">here</a> to verify your account.</p>
notification.otpEmail.subject=Finsight - Verification Code
notification.otpEmail.body=<h1>Your verification code</h1><p>Hi {firstName},</p><p>Your OTP code is: <b>{otpCode}</b></p><p>This code will expire in {expireMinutes} minutes.</p>
notification.accountLockedEmail.subject=Finsight - Security Alert
notification.accountLockedEmail.body=<h1>Security Alert</h1><p>Hi {firstName},</p><p>Your account has been temporarily locked after {maxAttempts} failed login attempts. You can try again in {blockMinutes} minutes.</p><p>If these attempts were not made by you, please change your password immediately.</p>
notification.passwordResetEmail.subject=Finsight - Password Reset
notification.passwordResetEmail.body=<h1>Password Reset Request</h1><p>Hi {firstName},</p><p>Click <a href="{resetUrl}">here</a> to reset your password. This link will expire soon.</p><p>If you did not request this, you can safely ignore this email.</p>

