notification.passwordChangedEmail.subject=Finsight - Your Password Was Changed
notification.passwordChangedEmail.body=<div style="max-width:480px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e0e0e0;"><div style="background-color:#1a1a2e;padding:24px 32px;text-align:center;"><span style="color:#ffffff;font-size:20px;font-weight:600;letter-spacing:3px;">FINSIGHT</span></div><div style="padding:32px;text-align:center;"><p style="font-size:18px;font-weight:500;color:#1a1a2e;margin:0 0 8px;">Your password was changed</p><p style="font-size:14px;color:#666666;margin:0 0 24px;">Hi {firstName}, the password of your Finsight account was changed successfully. All of your active sessions have been signed out.</p><div style="background-color:#fff8e1;border-radius:8px;padding:12px 16px;margin:0 0 24px;text-align:left;"><p style="font-size:13px;color:#e65100;margin:0;">If this was not you, please reset your password immediately and contact us.</p></div><div style="margin:0;"><a href="{resetUrl}" style="display:inline-block;background-color:#c62828;color:#ffffff;text-decoration:none;padding:12px 32px;border-radius:6px;font-size:14px;font-weight:500;">Reset password</a></div></div><div style="border-top:1px solid #f0f0f0;padding:16px 32px;text-align:center;"><p style="font-size:11px;color:#bbbbbb;margin:0;">Finsight security notification</p></div></div>
