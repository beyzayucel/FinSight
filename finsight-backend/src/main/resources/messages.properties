notification.verificationEmail.subject=Finsight - Welcome
notification.verificationEmail.body=<div style="max-width:480px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e0e0e0;"><div style="background-color:#1a1a2e;padding:24px 32px;text-align:center;"><span style="color:#ffffff;font-size:20px;font-weight:600;letter-spacing:3px;">FINSIGHT</span></div><div style="padding:32px;"><p style="font-size:18px;font-weight:500;color:#1a1a2e;margin:0 0 8px;text-align:center;">Welcome!</p><p style="font-size:14px;color:#666666;margin:0 0 24px;text-align:center;">Your account has been created. You can log in with the credentials below.</p><div style="background-color:#f8f8f8;border-radius:8px;padding:16px 20px;margin:0 0 24px;"><table style="width:100%;font-size:14px;border-collapse:collapse;"><tr><td style="color:#999999;padding:4px 0;width:120px;">Username</td><td style="color:#1a1a2e;font-weight:500;padding:4px 0;">{username}</td></tr><tr><td style="color:#999999;padding:4px 0;">Temporary password</td><td style="color:#1a1a2e;font-weight:500;padding:4px 0;font-family:monospace;">{temporaryPassword}</td></tr></table></div><div style="text-align:center;margin:0 0 24px;"><a href="{verificationUrl}" style="display:inline-block;background-color:#1a1a2e;color:#ffffff;text-decoration:none;padding:12px 32px;border-radius:6px;font-size:14px;font-weight:500;">Verify account</a></div><p style="font-size:13px;color:#999999;text-align:center;margin:0;">You will be asked to change your password on first login.</p></div><div style="border-top:1px solid #f0f0f0;padding:16px 32px;text-align:center;"><p style="font-size:11px;color:#bbbbbb;margin:0;">If you did not request this email, you can safely ignore it.</p></div></div>
notification.otpEmail.subject=Finsight - Verification Code
notification.otpEmail.body=<div style="max-width:480px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e0e0e0;"><div style="background-color:#1a1a2e;padding:24px 32px;text-align:center;"><span style="color:#ffffff;font-size:20px;font-weight:600;letter-spacing:3px;">FINSIGHT</span></div><div style="padding:32px;text-align:center;"><p style="font-size:18px;font-weight:500;color:#1a1a2e;margin:0 0 8px;">Two-Step Verification</p><p style="font-size:14px;color:#666666;margin:0 0 28px;">Hi {firstName}, enter the code below to complete your login.</p><div style="background-color:#f8f8f8;border-radius:8px;padding:20px;display:inline-block;margin:0 0 28px;"><span style="font-size:32px;font-weight:700;letter-spacing:12px;color:#1a1a2e;">{otpCode}</span></div><p style="font-size:13px;color:#999999;margin:0;">This code will expire in {expireMinutes} minutes.</p></div><div style="border-top:1px solid #f0f0f0;padding:16px 32px;text-align:center;"><p style="font-size:11px;color:#bbbbbb;margin:0;">If you did not request this email, you can safely ignore it.</p></div></div>
notification.accountLockedEmail.subject=Finsight - Security Alert
notification.accountLockedEmail.body=<div style="max-width:480px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e0e0e0;"><div style="background-color:#1a1a2e;padding:24px 32px;text-align:center;"><span style="color:#ffffff;font-size:20px;font-weight:600;letter-spacing:3px;">FINSIGHT</span></div><div style="padding:32px;text-align:center;"><p style="font-size:18px;font-weight:500;color:#1a1a2e;margin:0 0 8px;">Security alert</p><p style="font-size:14px;color:#666666;margin:0 0 24px;">Hi {firstName}, your account has been temporarily locked after {maxAttempts} failed login attempts. You can try again in {blockMinutes} minutes.</p><div style="margin:0 0 24px;"><a href="{resetUrl}" style="display:inline-block;background-color:#c62828;color:#ffffff;text-decoration:none;padding:12px 32px;border-radius:6px;font-size:14px;font-weight:500;">Reset password</a></div><p style="font-size:13px;color:#999999;margin:0;">If these attempts were not made by you, please reset your password immediately.</p></div><div style="border-top:1px solid #f0f0f0;padding:16px 32px;text-align:center;"><p style="font-size:11px;color:#bbbbbb;margin:0;">Finsight security notification</p></div></div>
