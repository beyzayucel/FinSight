notification.accountLockedEmail.body=<h1>Güvenlik Uyarısı</h1><p>Merhaba {firstName},</p><p>Hesabınız {maxAttempts} başarısız giriş denemesinden sonra geçici olarak kilitlendi. {blockMinutes} dakika sonra tekrar deneyebilirsiniz.</p><p>Bu denemeler size ait değilse lütfen şifrenizi hemen değiştirin.</p>

