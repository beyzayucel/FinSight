server:
  shutdown: graceful

spring:
  application:
    name: finsight
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 30s

  jackson:
    default-property-inclusion: non_null

  messages:
    basename: messages
    encoding: UTF-8

  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}
    admin:
      properties:
        request.timeout.ms: ${KAFKA_ADMIN_REQUEST_TIMEOUT_MS:5000}
        default.api.timeout.ms: ${KAFKA_ADMIN_DEFAULT_API_TIMEOUT_MS:5000}
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.akademi.finsight.notification.model
        spring.json.value.default.type: com.akademi.finsight.notification.model.NotificationRequestedEvent
        spring.json.use.type.headers: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        use_nationalized_character_data: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

notification:
  default-locale: tr
  kafka:
    topic: ${NOTIFICATION_TOPIC:finsight.notification.requested.v1}
    group-id: ${NOTIFICATION_GROUP_ID:notification-service}
    dead-letter-retention: ${NOTIFICATION_DLT_RETENTION:30d}
    dead-letter-suffix: ${NOTIFICATION_DLT_SUFFIX:.DLT}
    partitions: ${NOTIFICATION_TOPIC_PARTITIONS:3}
    replicas: ${NOTIFICATION_TOPIC_REPLICAS:1}
    retry:
      max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
      initial-interval: ${NOTIFICATION_RETRY_INITIAL_INTERVAL:1s}
      multiplier: ${NOTIFICATION_RETRY_MULTIPLIER:2}
      max-interval: ${NOTIFICATION_RETRY_MAX_INTERVAL:4s}
  idempotency:
    ttl: ${NOTIFICATION_IDEMPOTENCY_TTL:24h}
  mail:
    from: ${MAIL_FROM}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  rate-limit:
    login:
      block-duration: ${LOGIN_RATE_LIMIT_BLOCK_DURATION}
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS}
      duration: ${LOGIN_RATE_LIMIT_DURATION}

  otp:
    expire-duration: ${OTP_EXPIRE_DURATION}
    cooldown-duration: ${OTP_COOLDOWN_DURATION}
    max-attempts: ${OTP_MAX_ATTEMPTS}

  verification:
    url: ${VERIFICATION_BASE_URL}
    expire-days: ${VERIFICATION_EXPIRE_DAYS}

  password-reset:
    url: ${PASSWORD_RESET_BASE_URL}
    expire-duration: ${PASSWORD_RESET_EXPIRE_DURATION}

  stress-test:
    onnx:
      session:
        intra-op-num-threads: ${INTRA_OP_NUM_THREADS}
        inter-op-num-threads: ${INTER_OP_NUM_THREADS}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY}

news:
  api:
    url: ${NEWS_API_URL}
    token: ${NEWS_API_TOKEN}
    search-text: "hisse OR borsa OR BIST OR altın OR faiz OR TCMB OR tahvil OR repo OR fed OR \"döviz kuru\""
    cache-size: 3
    max-news-age-hours: 15

  cache:
    key-prefix: "infina:latest_news:"
    ttl: ${NEWS_CACHE_TTL:1h}

deepl:
  api:
    url: ${DEEPL_API_URL}
    key: ${DEEPL_API_KEY}

admin:
  email: ${ADMIN_EMAIL}
  username: ${ADMIN_USERNAME}
  first-name: ${ADMIN_FIRST_NAME}
  last-name: ${ADMIN_LAST_NAME}
  phone-number: ${ADMIN_PHONE_NUMBER}
  password: ${ADMIN_PASSWORD}

fund:
  code: ${FUND_CODE:TIE}
  periods: ${FUND_PERIODS:P10D,P20D,P30D,P90D}
  recommendation:
     ttl-hours: ${FUND_RECOMMENDATION_TTL_HOURS:4}

infina:
  api:
    base-url: ${INFINA_API_URL}
    key: ${INFINA_API_KEY}
    connect-timeout: ${INFINA_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${INFINA_API_READ_TIMEOUT:10s}